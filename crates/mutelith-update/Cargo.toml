[package]
name = "mutelith-update"
description = "Auto-update Mutelith from GitHub releases"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
self-replace = "1.5.1"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
ureq = { version = "3.5.1", features = ["json"] }
