[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.2"
edition = "2024"
authors = ["Faelayis"]
license = "MIT"
repository = "https://github.com/Faelayis/Mutelith"

[workspace.dependencies]
log = "0.4"
# Needed directly by the `implement` macro for COM callbacks.
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
	"Win32_Devices_FunctionDiscovery",
	"Win32_Foundation",
	"Win32_Graphics_Gdi",
	"Win32_System_Console",
	"Win32_System_LibraryLoader",
	"Win32_UI_Shell",
	"Win32_Media_Audio",
	"Win32_System_Com",
	"Win32_System_Com_StructuredStorage",
	"Win32_System_Diagnostics_ToolHelp",
	"Win32_System_SystemInformation",
	"Win32_System_Threading",
	"Win32_System_Variant",
	"Win32_UI_Shell_PropertiesSystem",
	"Win32_UI_WindowsAndMessaging",
] }
mutelith-core = { path = "crates/mutelith-core" }
mutelith-update = { path = "crates/mutelith-update" }
